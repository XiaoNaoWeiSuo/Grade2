name: grade2
description: "Just for you."
publish_to: 'none' # 私有包，禁止误发布

version: 2.5.31+1

environment:
  sdk: '>=3.11.0 <4.0.0'

# 依赖最小化原则：内核（lib/core/crawler）零第三方依赖，
# UI 层仅保留状态管理与文件路径定位两个插件。
dependencies:
  flutter:
    sdk: flutter
  # 状态管理（MVVM 的 ViewModel 驱动）
  flutter_riverpod: ^2.6.1
  # 应用目录定位（LocalCache / 会话状态落盘路径；路径只在组装层注入）
  path_provider: ^2.1.2
  # 密码安全存储（Keychain/Android Keystore；正式版账号簿，替代 base64 明文）
  flutter_secure_storage: ^11.1.0
  # CupertinoIcons 的正文字体（name=CupertinoIcons；缺它所有 Cupertino 图标变方框）
  cupertino_icons: ^1.0.8
  # 国际化（框架层本地化委托）
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Flutter 专属配置
flutter:
  # 资产按需添加（当前工程 UI 全部使用 Material 内置图标，无自定义资产）
  uses-material-design: true
